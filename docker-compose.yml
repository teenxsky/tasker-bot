name: ${APP_NAME}

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: app-dev
    volumes:
      - ./:/app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    healthcheck:
      test: [ "CMD", "php", "-v" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    hostname: ${DB_HOST}
    build:
      context: .
      dockerfile: ./Dockerfile
      target: postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Vladivostok}
    ports:
      - ${DB_PORT:-5432}:${DB_PORT:-5432}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
