[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/dev/null
childlogdir=/tmp
loglevel=critical
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:consumer]
command=php /var/www/artisan queue:work rabbitmq --max-jobs=200 --memory=256
autostart=true
autorestart=true
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600
